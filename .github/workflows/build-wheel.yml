name: Build Wheel

on:
  push:
    branches:
    - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install Python
      id: python
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"

    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      with:
        enable-cache: true

    - name: Build the sdist and the wheel
      env:
        UV_PYTHON: "${{ steps.python.outputs.python-path }}"
      run: uv build --sdist --wheel

    - name: Check the package metadata and the long description
      run: uv tool run twine check --strict dist/*

    - name: Check that the sdist does not ship the test suite
      run: |
        python -c "
        import glob, tarfile
        path = glob.glob('dist/*.tar.gz')[0]
        with tarfile.open(path) as tar:
            leaked = [name for name in tar.getnames() if '/tests/' in name]
        assert not leaked, f'the sdist ships the test suite: {leaked}'
        print('sdist ships no tests:', path)
        "

    - name: Inspect the built files
      run: |
        ls -l dist
        python -m zipfile -l dist/*.whl

    - name: Install the wheel into a clean environment and test it
      env:
        UV_PYTHON: "${{ steps.python.outputs.python-path }}"
      run: |
        set -euxo pipefail

        uv venv /tmp/wheel-env
        uv pip install --python /tmp/wheel-env/bin/python \
            dist/*.whl "pytest>=8" attrs

        # The tests must exercise the installed wheel, not the checkout, so
        # they run outside of the repository where the source tree can not
        # shadow the installed package.
        cp -r tests /tmp/wheel-tests
        cd /tmp/wheel-tests

        /tmp/wheel-env/bin/python -I -c "
        import pathlib, msgspecerror
        path = pathlib.Path(msgspecerror.__file__).resolve()
        print('msgspecerror:', path)
        assert 'site-packages' in str(path), f'not an installed copy: {path}'
        "

        /tmp/wheel-env/bin/python -m pytest . -q

    - name: Upload the built files
      uses: actions/upload-artifact@v5
      with:
        name: dist
        path: dist/*
        if-no-files-found: error
