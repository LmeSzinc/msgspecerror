name: Test

on:
  push:
    branches:
    - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    name: "Python ${{ matrix.python-version }} on ${{ matrix.os }}"
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
        - windows-latest
        python-version:
        # Every CPython that msgspecerror supports, plus the free-threaded
        # builds msgspec publishes wheels for. A 3.13t interpreter is not
        # listed: msgspec has no cp313t wheel, so there would be nothing to
        # install on it.
        - "3.8"
        - "3.9"
        - "3.10"
        - "3.11"
        - "3.12"
        - "3.13"
        - "3.14"
        - "3.15"
        - "3.14t"
        - "3.15t"

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install Python
      id: python
      uses: actions/setup-python@v6
      with:
        python-version: "${{ matrix.python-version }}"
        # 3.15 is still a pre-release, the other versions are released builds
        allow-prereleases: true

    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      with:
        enable-cache: true

    - name: Install test dependencies
      env:
        # Install into the interpreter setup-python selected, uv would
        # otherwise pick the first Python it finds on PATH
        UV_PYTHON: "${{ steps.python.outputs.python-path }}"
      run: |
        python -VV
        uv python find
        # packaging is what the backport step below reads the wheel metadata with
        uv pip install --system "pytest>=8" typing-extensions attrs packaging

    - name: Test every msgspec version this Python supports
      shell: bash
      env:
        UV_PYTHON: "${{ steps.python.outputs.python-path }}"
      run: |
        set -euo pipefail

        # The msgspec versions that publish a wheel for this interpreter.
        # msgspec raises its `requires-python` over time (0.18.6 is >=3.8,
        # 0.19.0/0.20.0 are >=3.9, 0.21.0 and later are >=3.10) and adds new
        # interpreters with new minor releases, so the supported set is per
        # Python version. Keep `msgspec` in pyproject.toml in sync with the
        # range covered here.
        case "${{ matrix.python-version }}" in
          3.8)            VERSIONS="0.18.6" ;;
          3.9)            VERSIONS="0.18.6 0.19.0 0.20.0" ;;
          3.10|3.11|3.12) VERSIONS="0.18.6 0.19.0 0.20.0 0.21.0 0.21.1 0.22.0" ;;
          3.13)           VERSIONS="0.19.0 0.20.0 0.21.0 0.21.1 0.22.0" ;;
          3.14|3.14t)     VERSIONS="0.20.0 0.21.0 0.21.1 0.22.0" ;;
          3.15|3.15t)     VERSIONS="0.22.0" ;;
          *)
            echo "No msgspec version table for Python ${{ matrix.python-version }}"
            exit 1
            ;;
        esac

        for version in $VERSIONS; do
          echo "::group::msgspec $version on Python ${{ matrix.python-version }}"
          uv pip install --system "msgspec==$version"
          python -c "import msgspec; print('msgspec', msgspec.__version__, msgspec.__file__)"
          python -m pytest tests -q
          echo "::endgroup::"
        done

    - name: Test the msgspec backport from py38deps
      shell: bash
      env:
        UV_PYTHON: "${{ steps.python.outputs.python-path }}"
      run: |
        set -euo pipefail

        # py38deps republishes msgspec for the interpreters upstream dropped
        # by raising requires-python (0.21.0 and later declare >=3.10, the
        # rebuild declares >=3.8) and rebuilds every version it carries for
        # every interpreter it builds them for, so a project that adds
        # https://py38deps.github.io/py38deps/simple/ as an extra index gets
        # these wheels on recent interpreters too. 0.21.1 is published for
        # cp38~cp314t and 0.22.0 for cp38~cp315t; a version the index does not
        # publish for this interpreter is left out rather than silently
        # falling back to the upstream wheel.
        case "${{ matrix.python-version }}" in
          3.8|3.9|3.10|3.11|3.12|3.13|3.14|3.14t) VERSIONS="0.21.1 0.22.0" ;;
          3.15|3.15t)                              VERSIONS="0.22.0" ;;
          *)
            echo "No msgspec backport table for Python ${{ matrix.python-version }}"
            exit 1
            ;;
        esac

        for version in $VERSIONS; do
          echo "::group::msgspec $version backport on Python ${{ matrix.python-version }}"
          # The backport index replaces PyPI as the only index, so the wheel
          # can not come from anywhere else, and --reinstall replaces the
          # wheel the step above installed from PyPI: both versions exist
          # upstream as well, so a leftover upstream wheel would pass the
          # tests below without ever exercising the backport.
          uv pip install --system --reinstall \
            --index-url https://py38deps.github.io/py38deps/simple/ \
            "msgspec==$version"
          # The rebuild declares requires-python >=3.8 where upstream declares
          # >=3.10 for the same version, so the last assertion is what proves
          # the installed wheel is the backport and not an upstream build.
          python -c "import importlib.metadata as md, msgspec; from packaging.specifiers import SpecifierSet; rp = md.metadata('msgspec')['Requires-Python']; print('msgspec', msgspec.__version__, rp, msgspec.__file__); assert msgspec.__version__ == '$version', msgspec.__version__; assert SpecifierSet(rp).contains('3.8'), rp"
          python -m pytest tests -q
          echo "::endgroup::"
        done
